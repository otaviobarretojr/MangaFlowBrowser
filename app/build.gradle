plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mangaflow.browser'
    compileSdk 37

    defaultConfig {
        applicationId 'com.mangaflow.browser'
        minSdk 26
        targetSdk 35
        // O CI aumenta o número a cada execução; preserva instalação por cima.
        versionCode (System.getenv('MF_VERSION_CODE')?.toInteger() ?: 1)
        versionName (System.getenv('MF_VERSION_NAME') ?: '0.3.0')
    }

    signingConfigs {
        release {
            // Keystore privada gerada no CI e mantida criptografada no GitHub.
            storeFile file(System.getenv('MF_KEYSTORE_PATH') ?: 'no-release-keystore.jks')
            storeType 'PKCS12'
            storePassword System.getenv('MF_SIGNING_PASSWORD') ?: ''
            keyAlias 'mangaflow'
            keyPassword System.getenv('MF_SIGNING_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
}
