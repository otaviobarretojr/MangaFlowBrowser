name: Validar compilação Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verificar scripts e recursos
        run: bash check_project.sh
      - name: Instalar Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar código sem distribuir APK debug
        run: gradle --no-daemon :app:assembleDebug --stacktrace
