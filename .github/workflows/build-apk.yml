name: Gerar APK Túnel Pessoal
on:
  push:
    branches: [tunel-pessoal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar API 36 no SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reutilizar assinatura debug nas atualizações
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tunel-pessoal-debug-signing-v1
      - name: Compilar APK instalável
        run: gradle --no-daemon :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TunelPessoal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
