name: MangaFlow Android — APK assinado
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita duas execuções gerando chaves diferentes ao mesmo tempo.
concurrency:
  group: mangaflow-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Validar scripts e ícone
        run: bash check_project.sh
      - name: Testar filtros de anúncios e sintaxe da extensão
        run: |
          node --check app/src/main/assets/reader/ad-cleaner.js
          node --check app/src/main/assets/reader/blocker.js
          node --check app/src/main/assets/reader/reader.js
          node --test tests/ad-cleaner.test.cjs
      - name: Instalar Android SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Recuperar ou criar assinatura permanente (criptografada)
        shell: bash
        env:
          MF_SIGNING_PASSWORD: ${{ secrets.MF_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${MF_SIGNING_PASSWORD:-}" ]]; then
            echo "::error::O secret MF_SIGNING_PASSWORD está ausente."
            exit 1
          fi
          if [[ "${#MF_SIGNING_PASSWORD}" -lt 6 ]]; then
            echo "::error::A senha do secret MF_SIGNING_PASSWORD precisa ter pelo menos seis caracteres."
            exit 1
          fi
          SIGN_FILE="$RUNNER_TEMP/mangaflow-release.jks"
          ENCRYPTED_FILE="signing/mangaflow-release.jks.enc"
          mkdir -p signing
          if [[ -f "$ENCRYPTED_FILE" ]]; then
            echo "Recuperando a chave permanente criptografada já existente."
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -md sha256 -in "$ENCRYPTED_FILE" -out "$SIGN_FILE" -pass env:MF_SIGNING_PASSWORD; then
              echo "::error::Não foi possível descriptografar a chave. Confira MF_SIGNING_PASSWORD. Não gere outra chave para atualizar o app."
              exit 1
            fi
          else
            echo "Primeira compilação: gerando uma chave privada permanente para futuras atualizações."
            keytool -genkeypair -noprompt -keystore "$SIGN_FILE" -storetype PKCS12 \
              -storepass "$MF_SIGNING_PASSWORD" -keypass "$MF_SIGNING_PASSWORD" \
              -alias mangaflow -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
              -validity 10000 -dname "CN=MangaFlow Browser, OU=Android, O=MangaFlow, C=BR"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -md sha256 \
              -in "$SIGN_FILE" -out "$ENCRYPTED_FILE" -pass env:MF_SIGNING_PASSWORD
            git add -f "$ENCRYPTED_FILE"
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(signing): guardar chave de atualização criptografada"
            git push origin "HEAD:main"
          fi
          if ! keytool -list -keystore "$SIGN_FILE" -storetype PKCS12 \
            -storepass "$MF_SIGNING_PASSWORD" -alias mangaflow >/dev/null 2>&1; then
            echo "::error::A chave privada não corresponde à senha configurada."
            exit 1
          fi
          echo "MF_KEYSTORE_PATH=$SIGN_FILE" >> "$GITHUB_ENV"
          echo "Assinatura permanente pronta; a chave NÃO foi exposta no repositório."
          echo "MF_VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          echo "MF_VERSION_NAME=0.3.0.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Compilar release assinado
        env:
          MF_SIGNING_PASSWORD: ${{ secrets.MF_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Conferir assinatura e identidade do APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | head -n 3
      - name: Publicar APK com link direto permanente (GitHub Release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/MangaFlowBrowser.apk
          TAG="v${MF_VERSION_NAME}"
          printf 'MangaFlow Browser %s\n\nAPK Android assinado com chave permanente, instalável sobre versões anteriores.\n' "$MF_VERSION_NAME" > release-notes.md
          gh release create "$TAG" release/MangaFlowBrowser.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MangaFlow Browser $MF_VERSION_NAME" \
            --notes-file release-notes.md \
            --latest
          echo "Download direto: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/MangaFlowBrowser.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK pronto para instalar
        uses: actions/upload-artifact@v4
        with:
          name: MangaFlow-APK-Assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
