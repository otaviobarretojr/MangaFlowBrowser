name: MangaFlow Android — APK assinado
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Validar scripts e ícone
        run: bash check_project.sh
      - name: Instalar Android SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Conferir chave de assinatura e preparar APK atualizável
        env:
          KEYSTORE_B64: ${{ secrets.MF_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MF_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::Secrets ausentes: configure MF_SIGNING_KEYSTORE_BASE64 e MF_SIGNING_PASSWORD."
            exit 1
          fi
          SIGN_FILE="$RUNNER_TEMP/mangaflow-release.jks"
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > "$SIGN_FILE"; then
            echo "::error::MF_SIGNING_KEYSTORE_BASE64 não é um Base64 válido. Copie novamente o arquivo KEYSTORE_BASE64.txt completo."
            exit 1
          fi
          EXPECTED_SHA256="a9c9ea38aa2d565c224a1748d11279cfd8437121d719af8e73c10e84a18c6cf2"
          ACTUAL_SHA256="$(sha256sum "$SIGN_FILE" | cut -d' ' -f1)"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::A chave decodificada não corresponde ao kit permanente original. Substitua MF_SIGNING_KEYSTORE_BASE64 pelo conteúdo COMPLETO de KEYSTORE_BASE64.txt, sem trocar de chave."
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 -keystore "$SIGN_FILE" -storepass "$SIGNING_PASSWORD" -alias mangaflow > /dev/null 2>&1; then
            echo "::error::A senha não abriu a chave original. Confira MF_SIGNING_PASSWORD com o conteúdo de SENHA_PRIVADA.txt."
            exit 1
          fi
          if ! openssl pkcs12 -in "$SIGN_FILE" -nocerts -nodes -passin env:SIGNING_PASSWORD -out /dev/null > /dev/null 2>&1; then
            echo "::error::A senha não permitiu recuperar a chave privada. Verifique o secret MF_SIGNING_PASSWORD."
            exit 1
          fi
          echo "MF_KEYSTORE_PATH=$SIGN_FILE" >> "$GITHUB_ENV"
          echo "Chave permanente original e senha verificadas, sem expor segredos."
      - name: Montar APK release assinado
        env:
          MF_SIGNING_PASSWORD: ${{ secrets.MF_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verificar assinatura do APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publicar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: MangaFlow-v0.1.1-APK-assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
